name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scheduler-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m py_compile server.py storage.py security.py scheduler_engine.py
      - name: Run scheduler tests
        run: python -m unittest -v tests/test_scheduler_engine.py
